name: Bug report
description: Report a reproducible counter, sync, or interface problem.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include travel history, email codes, session cookies, or Cloudflare credentials.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the smallest set of steps needed to reproduce it.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, device, and operating system.
    validations:
      required: true
