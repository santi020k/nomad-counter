version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      timezone: America/Bogota
    open-pull-requests-limit: 3
    groups:
      npm-dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: America/Bogota
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - '*'
